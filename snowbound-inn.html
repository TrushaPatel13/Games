<html lang="en">
<head>

<title>Snowbound Inn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* FrozenWizard theme: shared by every FW game. One dark look, colors set explicitly. */
  :root {
    color-scheme: dark;
    --bg: #1a1240;         /* indigo */
    --court: #231a52;
    --line: #3a2d78;
    --ink: #eaf6ff;        /* ice white */
    --muted: #a59cd0;
    --violet: #b48cff;
    --purple: #7c4ddb;
    --blueviolet: #7a6cf0;
    --frost: #8fd3ff;
    --rose: #ff6fa8;       /* danger */
    --gold: #ffd66e;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 "IBM Plex Mono", ui-monospace, Consolas, monospace;
    padding: 12px 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header {
    width: 100%;
    max-width: var(--game-w);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  h1 {
    font: 700 22px/1 "Silkscreen", "IBM Plex Mono", monospace;
    letter-spacing: 0.04em;
    margin: 0;
    color: var(--frost);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 40px; height: 40px; image-rendering: pixelated; }
  .studio {
    display: block;
    font: 700 11px/1 "Silkscreen", "IBM Plex Mono", monospace;
    letter-spacing: 0.08em;
    color: var(--frost);
    margin-bottom: 4px;
  }
  .studio span { color: var(--violet); }
  .keys { color: var(--muted); font-size: 12px; text-align: right; }
  kbd {
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 4px;
    color: var(--ink);
  }
  :root { --game-w: min(880px, calc((100dvh - 132px) * 16 / 9), 100%); }
  canvas {
    display: block;
    width: var(--game-w);
    aspect-ratio: 16 / 9;
    max-width: 100%;
    background: var(--court);
    border: 2px solid var(--line);
    border-radius: 6px;
    touch-action: none;
  }
  canvas:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  @media (max-width: 600px) { .keys { display: none; } }
  .copy { color: var(--muted); font-size: 11px; margin: 0; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="logo" src="brand/frozenwizard-logo.svg" alt="FrozenWizard logo">
    <div><span class="studio">FROZEN<span>WIZARD</span></span><h1>Snowbound Inn</h1></div>
  </div>
  <div class="keys"><kbd>←</kbd><kbd>→</kbd> walk · <kbd>↑</kbd>/<kbd>Space</kbd> act · <kbd>1</kbd>–<kbd>5</kbd> choose · <kbd>N</kbd> notebook</div>
</header>
<canvas id="game" tabindex="0" aria-label="Snowbound Inn, a murder mystery. Left and Right to walk, Up or Space to talk and search, number keys to choose, N to open your notebook."></canvas>
<p class="copy">© 2026 FrozenWizard · Trusha Patel. All rights reserved.</p>

<script>
/* =====================================================================
   SNOWBOUND INN: a murder mystery with a different killer every game.
   Each suspect gets three random traits (hand, scent, boots). Three
   clues reveal the killer's traits; only one suspect matches all three.
   Everything runs in a fixed 640x360 world; the canvas is scaled to fit.
   ===================================================================== */
const W = 640, H = 360;
const PLAY_GROUND = 304, END_GROUND = 196;
let GROUND = PLAY_GROUND;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pickOne = arr => arr[Math.floor(Math.random() * arr.length)];
const C = { night: '#120c30', line: '#3a2d78', ink: '#eaf6ff', muted: '#a59cd0', violet: '#b48cff',
            frost: '#8fd3ff', ice: '#bfe3ff', rose: '#ff6fa8', gold: '#ffd66e', wood: '#6b4a36', dark: '#2a1a16' };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
resize();
addEventListener('resize', resize);

/* ---------------------------------------------------------------------
   STEP 1: THE CAST, as pixel sprites. Letters are palette colours.
   --------------------------------------------------------------------- */
const PAL = { k: '#0f0a26', s: '#f2c9a0', b: '#6b4226', o: '#d9803a', u: '#f2d06b', a: '#a8a4b8',
              p: '#7c4ddb', m: '#8a2a4a', w: '#eaf6ff', z: '#2a2438', h: '#b8323f', n: '#2e3a6e',
              y: '#ffd66e', e: '#3f7a4a', c: '#6b4a36', x: '#2f7f7a' };
const SPR = {
  rosalind: [
    '....uuuu....',
    '...uuuuuu...',
    '...usssssu..',
    '...usksksu..',
    '....sssss...',
    '....mwwwm...',
    '...mmmmmmm..',
    '..smmmmmmms.',
    '...mmmmmmm..',
    '...mmmmmmm..',
    '..mmmmmmmmm.',
    '..mmmmmmmmm.',
    '.mmmmmmmmmmm',
    '.mmmmmmmmmmm'],
  fenwick: [
    '....aaaaa...',
    '...aaaaaaa..',
    '...asssssa..',
    '...akkskka..',
    '....sssss...',
    '....zwwwz...',
    '...zzwwwzz..',
    '..szzzwzzzs.',
    '...zzzwzzz..',
    '...zzzzzzz..',
    '...zzzzzzz..',
    '...zzzzzzz..',
    '....kk.kk...',
    '....kk.kk...'],
  harlan: [
    '...nnnnnn...',
    '..nnnnnnnn..',
    '...kkkkkkk..',
    '...sskskss..',
    '...saaaaas..',
    '....sssss...',
    '...hhhhhhh..',
    '..shhhyhhhs.',
    '...hhhyhhh..',
    '...hhhyhhh..',
    '...nnnnnnn..',
    '...nnn.nnn..',
    '...kkk.kkk..',
    '...kkk.kkk..'],
  nell: [
    '....wwwww...',
    '...ooooooo..',
    '...ossssso..',
    '...oskskso..',
    '...ossssso..',
    '....zzzzz...',
    '...zzwwwzz..',
    '..szzwwwzzs.',
    '...zwwwwwz..',
    '...zwwwwwz..',
    '..zzwwwwwzz.',
    '..zzzzzzzzz.',
    '....kk.kk...',
    '....kk.kk...'],
  otto: [
    '............',
    '...sssssss..',
    '..sssssssss.',
    '..sskssskss.',
    '..sbsssssbs.',
    '..bbbbbbbbb.',
    '...bbbbbbb..',
    '..seeebeeees',
    '..eeeeeeeee.',
    '..eeeeeeeee.',
    '..eeeeeeeee.',
    '...ccccccc..',
    '...cc...cc..',
    '...kk...kk..'],
  vane: [
    '...kkkkkk...',
    '...kkkkkk...',
    '..kkkkkkkk..',
    '...sssssss..',
    '...sksssks..',
    '...saaaaas..',
    '....sssss...',
    '...xxxwxxx..',
    '..sxxxwxxxs.',
    '...xxxwxxx..',
    '...xxxxxxx..',
    '...zzz.zzz..',
    '...zzz.zzz..',
    '...kk...kk..'],
};
const sprCache = {};
function spr(name) {
  if (sprCache[name]) return sprCache[name];
  const rows = SPR[name], c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (PAL[ch]) { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } }));
  return (sprCache[name] = c);
}
function drawSprite(src, x, y, scale, flip = false, alpha = 1) {
  if (!src) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(Math.round(x), Math.round(y));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(src, -src.width * scale / 2, -src.height * scale, src.width * scale, src.height * scale);
  ctx.restore();
}
// A body on the floor: the same sprite, tipped over with the head to the left.
function drawLying(src, x, y, scale) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ellipse(0, -2, src.height * scale * 0.55, 5, 'rgba(90, 10, 20, 0.55)');
  ctx.rotate(-Math.PI / 2);
  ctx.drawImage(src, -2 * scale, -src.height * scale / 2, src.width * scale, src.height * scale);
  ctx.restore();
}

const wizardImg = new Image();
let wizardC = null;
wizardImg.onload = () => {
  wizardC = document.createElement('canvas'); wizardC.width = wizardC.height = 24;
  wizardC.getContext('2d').drawImage(wizardImg, 0, 0, 24, 24);
};
wizardImg.src = 'brand/frozenwizard-logo.svg';
function drawWizard(x, y, face, scale = 2) { drawSprite(wizardC, x + 2.5 * scale * face, y, scale, face < 0); }

/* ---------------------------------------------------------------------
   STEP 2: DRAWING HELPERS.
   --------------------------------------------------------------------- */
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function poly(pts, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function ellipse(x, y, rx, ry, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(color, a)); g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function sky(top, bottom) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);
}
function text(str, x, y, size, color, align = 'center', font = 'Silkscreen') {
  ctx.fillStyle = color;
  ctx.font = `${size}px "${font}", "IBM Plex Mono", monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function roundBox(x, y, w, h, r, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function world(camX, fn) { ctx.save(); ctx.translate(-Math.round(camX), 0); fn(); ctx.restore(); }
function snowfall(n, speed, x0 = 0, x1 = W, y0 = 0, y1 = H, alpha = 0.7, camX = 0) {
  if (reduceMotion) n = Math.floor(n / 4);
  ctx.fillStyle = C.ink;
  const span = x1 - x0, hgt = y1 - y0;
  for (let i = 0; i < n; i++) {
    const y = y0 + (hash(i + 99) * hgt + time * speed * (0.5 + hash(i + 7))) % hgt;
    const x = x0 + (((hash(i) * span + Math.sin(time + i) * 6 - camX * 0.6) % span) + span) % span;
    ctx.globalAlpha = alpha; ctx.fillRect(x, y, 1 + hash(i + 3) * 1.5, 1 + hash(i + 3) * 1.5);
  }
  ctx.globalAlpha = 1;
}
function flames(x, y, s = 1) {
  for (let k = 0; k < 5; k++) {
    const fh = (18 + Math.sin(time * 9 + k * 1.7) * 5 + (k === 2 ? 12 : 0)) * s, ox = (k - 2) * 7 * s;
    poly([x + ox - 8 * s, y, x + ox + 8 * s, y, x + ox + Math.sin(time * 7 + k) * 2, y - fh], k % 2 ? C.gold : '#ff8f3e');
  }
}

/* ---------------------------------------------------------------------
   STEP 3: THE INN. Rooms are built from furniture functions.
   --------------------------------------------------------------------- */
function wallpaper(w, base, stripe) {
  rect(0, 0, w, GROUND, base);
  ctx.fillStyle = stripe;
  for (let x = 0; x < w; x += 28) ctx.fillRect(x, 0, 10, GROUND - 74);
  rect(0, GROUND - 74, w, 74, '#3b2620');
  ctx.strokeStyle = C.dark; ctx.lineWidth = 2;
  for (let x = 10; x < w; x += 70) ctx.strokeRect(x, GROUND - 62, 56, 50);
  rect(0, GROUND - 78, w, 6, C.wood);
  rect(0, 0, w, 12, C.dark);
  for (let x = 0; x < w; x += 160) rect(x, 0, 14, 28, C.dark);
}
function floorboards(w, color = '#4a2f25') {
  rect(0, GROUND, w, H - GROUND, color);
  for (let y = GROUND + 10; y < H; y += 12) rect(0, y, w, 2, 'rgba(0, 0, 0, 0.25)');
  rect(0, GROUND - 4, w, 4, C.dark);
}
function rug(x, w, color) { ellipse(x, GROUND + 16, w / 2, 10, color); ellipse(x, GROUND + 16, w / 2 - 8, 6, hexA(C.gold, 0.25)); }
function windowNight(x, y, w, h) {
  rect(x - 5, y - 5, w + 10, h + 10, '#4a2f25');
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  rect(x, y, w, h, C.night);
  snowfall(14, 30, x, x + w, y, y + h, 0.8);
  rect(x, y + h - 10, w, 10, '#c4cfee');
  ctx.restore();
  rect(x + w / 2 - 2, y, 4, h, '#4a2f25'); rect(x, y + h / 2 - 2, w, 4, '#4a2f25');
  poly([x - 12, y - 8, x + 8, y - 8, x + 2, y + h + 6, x - 14, y + h + 6], '#6a1f35');   // curtains
  poly([x + w - 8, y - 8, x + w + 12, y - 8, x + w + 14, y + h + 6, x + w - 2, y + h + 6], '#6a1f35');
  rect(x - 8, y + h + 4, w + 16, 5, C.wood);
}
function fireplace(x, lit = true) {
  rect(x - 70, GROUND - 130, 140, 130, '#6d6590');
  ctx.fillStyle = 'rgba(15, 10, 38, 0.2)';
  for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++) ctx.fillRect(x - 70 + c * 36 + (r % 2 ? 18 : 0), GROUND - 130 + r * 22, 34, 2);
  rect(x - 82, GROUND - 140, 164, 12, '#4a2f25');
  rect(x - 44, GROUND - 90, 88, 90, '#0f0a26');
  rect(x - 30, GROUND - 10, 60, 8, '#5a3a2a');
  if (lit) { glow(x, GROUND - 40, 150, '#ffb347', 0.3); flames(x, GROUND - 8); }
  else { for (let i = 0; i < 8; i++) rect(x - 26 + i * 7, GROUND - 8 - hash(i) * 4, 5, 3, '#3a3448'); }
  for (const cx of [x - 62, x + 58]) {                          // candles on the mantel
    rect(cx, GROUND - 156, 4, 16, C.ink);
    if (lit) { glow(cx + 2, GROUND - 160, 12, C.gold, 0.5); rect(cx + 1, GROUND - 162, 2, 4, C.gold); }
  }
}
function painting(x, y, who) {
  rect(x - 28, y - 34, 56, 68, '#c9a14a');
  rect(x - 22, y - 28, 44, 56, '#2a2060');
  drawSprite(spr(who), x, y + 30, 2.4);
}
function clock(x) {
  rect(x - 14, GROUND - 150, 28, 150, '#5a3a2a');
  rect(x - 18, GROUND - 168, 36, 40, '#4a2f25');
  ellipse(x, GROUND - 148, 13, 13, C.ink);
  ctx.strokeStyle = C.dark; ctx.lineWidth = 2; ctx.beginPath();
  const hr = (11 + 47 / 60) / 12 * Math.PI * 2 - Math.PI / 2, mn = 47 / 60 * Math.PI * 2 - Math.PI / 2;
  ctx.moveTo(x, GROUND - 148); ctx.lineTo(x + Math.cos(hr) * 7, GROUND - 148 + Math.sin(hr) * 7);
  ctx.moveTo(x, GROUND - 148); ctx.lineTo(x + Math.cos(mn) * 11, GROUND - 148 + Math.sin(mn) * 11);
  ctx.stroke();
  rect(x - 8, GROUND - 110, 16, 70, '#2a1a16');
  rect(x - 1, GROUND - 108, 2, 50, '#c9a14a'); ellipse(x, GROUND - 56, 6, 6, '#c9a14a');   // the pendulum isn't moving
}
function chandelier(x) {
  rect(x - 1, 0, 2, 40, '#8a6a2a');
  ctx.strokeStyle = '#c9a14a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(x, 44, 36, 7, 0, 0, Math.PI * 2); ctx.stroke();
  for (let i = -2; i <= 2; i++) {
    const cx = x + i * 15;
    rect(cx - 1, 32, 3, 10, C.ink);
    glow(cx, 28, 16, C.gold, 0.45); rect(cx, 26, 2, 4, C.gold);
  }
}
function armchair(x, color, flip = false) {
  const d = flip ? -1 : 1;
  rect(x - 20, GROUND - 58, 40, 32, color);
  rect(x - 24, GROUND - 30, 48, 16, color);
  rect(x - 28, GROUND - 42, 8, 28, hexA('#000000', 0.25)); rect(x + 20, GROUND - 42, 8, 28, hexA('#000000', 0.25));
  rect(x - 22 * d, GROUND - 14, 4, 10, C.dark); rect(x + 18 * d, GROUND - 14, 4, 10, C.dark);
}
function door(x, label) {
  rect(x - 26, GROUND - 96, 52, 96, C.dark);
  rect(x - 21, GROUND - 91, 42, 91, C.wood);
  ctx.strokeStyle = '#4a2f25'; ctx.lineWidth = 2;
  ctx.strokeRect(x - 15, GROUND - 84, 30, 34); ctx.strokeRect(x - 15, GROUND - 44, 30, 36);
  ellipse(x + 13, GROUND - 46, 3, 3, C.gold);
  if (label) { rect(x - 28, GROUND - 112, 56, 13, '#c9a14a'); text(label, x, GROUND - 105, 7, C.dark); }
}
function stairs(x) {
  for (let i = 0; i < 9; i++) {
    rect(x - 40 + i * 14, GROUND - (i + 1) * 14, 190, 14, '#5a3a2a');
    rect(x - 40 + i * 14, GROUND - (i + 1) * 14, 190, 3, '#7a5a44');
  }
  ctx.strokeStyle = '#3b2620'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x - 44, GROUND - 44); ctx.lineTo(x + 86, GROUND - 170); ctx.stroke();
  for (let i = 0; i < 5; i++) rect(x - 40 + i * 28, GROUND - 40 - i * 27, 3, 32, '#3b2620');
}
function desk(x) {
  rect(x - 54, GROUND - 52, 108, 8, '#5a3a2a');
  rect(x - 50, GROUND - 44, 32, 44, '#4a2f25'); rect(x + 18, GROUND - 44, 32, 44, '#4a2f25');
  rect(x - 44, GROUND - 32, 20, 3, C.gold); rect(x + 24, GROUND - 32, 20, 3, C.gold);
  rect(x - 30, GROUND - 56, 26, 4, C.ink); rect(x - 24, GROUND - 58, 22, 3, '#d8d0bc');
  rect(x + 20, GROUND - 60, 8, 8, '#1a1240');
}
function bookshelf(x) {
  rect(x - 38, GROUND - 170, 76, 170, '#5a3a2a');
  const spines = [C.violet, '#d9803a', C.frost, '#b8323f', C.gold, '#3f7a4a'];
  for (let s = 0; s < 5; s++) {
    rect(x - 34, GROUND - 146 + s * 30, 68, 3, '#3b2620');
    for (let b = 0; b < 8; b++) rect(x - 32 + b * 8, GROUND - 166 + s * 30, 6, 20 - (hash(b + s * 9) * 6 | 0), spines[(b + s) % spines.length]);
  }
}
function sideTable(x, cups = 1) {
  rect(x - 18, GROUND - 44, 36, 5, '#5a3a2a');
  rect(x - 2, GROUND - 39, 4, 39, '#4a2f25'); rect(x - 10, GROUND - 3, 20, 3, '#4a2f25');
  for (let i = 0; i < cups; i++) { rect(x - 10 + i * 12, GROUND - 46, 10, 2, C.ink); rect(x - 8 + i * 12, GROUND - 53, 7, 7, C.ink); }
}
function candlestick(x, y) { rect(x - 4, y - 3, 8, 3, '#c9c5da'); rect(x - 1, y - 18, 3, 16, '#c9c5da'); rect(x - 4, y - 20, 9, 3, '#c9c5da'); }

function kitchenWall(w) {
  rect(0, 0, w, GROUND, '#4f5a78');
  ctx.fillStyle = 'rgba(15, 10, 38, 0.18)';
  for (let y = 14; y < GROUND - 74; y += 18) ctx.fillRect(0, y, w, 2);
  for (let y = 14, r = 0; y < GROUND - 74; y += 18, r++) for (let x = (r % 2) * 18; x < w; x += 36) ctx.fillRect(x, y, 2, 18);
  rect(0, GROUND - 74, w, 74, '#3b2620');
  rect(0, GROUND - 78, w, 6, C.wood);
  rect(0, 0, w, 12, C.dark);
}
function stove(x) {
  rect(x - 5, 0, 10, GROUND - 90, '#1a1a24');
  rect(x - 44, GROUND - 90, 88, 90, '#1a1a24');
  rect(x - 48, GROUND - 94, 96, 8, '#2a2a38');
  rect(x - 26, GROUND - 60, 52, 34, '#0f0a26');
  glow(x, GROUND - 44, 60, '#ff8f3e', 0.35); flames(x, GROUND - 28, 0.7);
  ellipse(x - 22, GROUND - 100, 16, 8, '#5a5a6a'); rect(x - 38, GROUND - 106, 32, 8, '#5a5a6a');
  for (let i = 0; i < 3; i++) { const ph = (time * 0.5 + i / 3) % 1; ellipse(x - 22 + Math.sin(ph * 6) * 5, GROUND - 112 - ph * 40, 5 + ph * 5, 3 + ph * 3, hexA(C.ink, 0.25 * (1 - ph))); }
}
function kitchenTable(x) {
  rect(x - 60, GROUND - 42, 120, 8, '#7a5a44');
  rect(x - 54, GROUND - 34, 6, 34, '#5a3a2a'); rect(x + 48, GROUND - 34, 6, 34, '#5a3a2a');
  ellipse(x - 30, GROUND - 47, 12, 6, '#d9a060'); rect(x + 10, GROUND - 52, 20, 10, C.ink);

/* ---------------------------------------------------------------------
   STEP 4: THE CASE. A new random case every game.
   Each suspect gets a hand, a scent and boots. The killer's combination
   is unique, but each single clue fits at least two other people.
   --------------------------------------------------------------------- */
const SUSPECTS = ['rosalind', 'fenwick', 'harlan', 'nell', 'otto'];
const NAME = { rosalind: 'Lady Rosalind', fenwick: 'Dr. Fenwick', harlan: 'Captain Harlan', nell: 'Nell the maid', otto: 'Otto the innkeeper' };
const SHORT = { rosalind: 'ROSALIND', fenwick: 'FENWICK', harlan: 'HARLAN', nell: 'NELL', otto: 'OTTO' };
const TRAITS = ['hand', 'scent', 'boots'];
const TRAIT_LABEL = { hand: 'HAND', scent: 'SCENT', boots: 'BOOTS' };

function newCase() {
  for (;;) {
    const attrs = {};
    for (const s of SUSPECTS) attrs[s] = {
      hand: Math.random() < 0.45 ? 'LEFT' : 'RIGHT',
      scent: Math.random() < 0.5 ? 'LAVENDER' : 'PIPE SMOKE',
      boots: Math.random() < 0.5 ? 'WET' : 'DRY',
    };
    const killer = pickOne(SUSPECTS), k = attrs[killer];
    const fits = keys => SUSPECTS.filter(s => s !== killer && keys.every(t => attrs[s][t] === k[t])).length;
    if (fits(TRAITS)) continue;                                     // only one person can match everything
    if (TRAITS.some(t => fits([t]) < 2)) continue;                  // no single clue gives it away
    if ([['hand', 'scent'], ['hand', 'boots'], ['scent', 'boots']].filter(p => fits(p)).length < 2) continue;
    return { attrs, killer };
  }
}

/* ---------------------------------------------------------------------
   STEP 8: DIALOG BOX. Pages type out; choices appear on the last page.
   A page is text (said by the node's speaker) or {text} (narration).
   --------------------------------------------------------------------- */
const DLG_FONT = '13px "IBM Plex Mono", monospace';
const SPEAKER_COLOR = { rosalind: '#e08aa8', fenwick: C.ice, harlan: '#ff8a7a', nell: '#ffb46e', otto: '#8fd48a' };
let choiceRects = [];

function wrap(str, maxW) {
  const out = [];
  let line = '';
  for (const word of str.split(' ')) {
    const t = line ? line + ' ' + word : word;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
  }
  out.push(line);
  return out;
}
function say(n) { dlg = { n, page: 0, chars: 0, sel: 0 }; layoutPage(); }
function layoutPage() {
  const p = dlg.n.pages[dlg.page];
  dlg.speaker = typeof p === 'string' ? dlg.n.speaker : null;
  ctx.font = DLG_FONT;
  dlg.lines = wrap(typeof p === 'string' ? p : p.text, W - 52 - (dlg.speaker ? 72 : 0));
  dlg.len = dlg.lines.join('').length;
}
const pageDone = () => dlg.chars >= dlg.len;
const lastPage = () => dlg.page === dlg.n.pages.length - 1;
const choicesUp = () => dlg && lastPage() && pageDone() && dlg.n.choices;

function advance() {
  if (!pageDone()) { dlg.chars = Infinity; return; }
  if (!lastPage()) { dlg.page++; dlg.chars = 0; layoutPage(); return; }
  if (dlg.n.choices) return pick(dlg.sel);
  const n = dlg.n; dlg = null;
  if (n.onEnd) n.onEnd();
}
function pick(i) {
  const c = dlg.n.choices[i];
  if (!c) return;
  chime(520);
  dlg = null;
  c.act();
}

function drawDialog() {
  const n = dlg.n, sp = dlg.speaker;
  const choices = choicesUp() ? n.choices : [];
  const tx0 = 26 + (sp ? 72 : 0);
  const h = Math.max(sp ? 88 : 0, 16 + (sp ? 18 : 0) + dlg.lines.length * 18 + (choices.length ? 8 + choices.length * 22 : 18));
  const x = 10, w = W - 20, y = H - 10 - h;
  roundBox(x, y, w, h, 6, 'rgba(15, 10, 38, 0.94)', C.line);
  let ty = y + 20;
  if (sp) {
    roundBox(x + 12, y + 12, 60, 64, 4, '#1a1240', C.line);
    ctx.save(); ctx.beginPath(); ctx.rect(x + 13, y + 13, 58, 62); ctx.clip();
    drawSprite(spr(sp), x + 42, y + 76, 4);
    ctx.restore();
    text(NAME[sp].toUpperCase(), tx0, ty, 10, SPEAKER_COLOR[sp], 'left');
    ty += 18;
  }
  ctx.font = DLG_FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = sp ? C.ink : '#d8d0f0';
  let budget = dlg.chars;
  for (const line of dlg.lines) {
    if (budget > 0) ctx.fillText(line.slice(0, Math.floor(budget)), tx0, ty);
    budget -= line.length; ty += 18;
  }
  choiceRects = [];
  if (choices.length) {
    ty += 4;
    choices.forEach((c, i) => {
      const sel = i === dlg.sel;
      const r = { x: tx0 - 8, y: ty - 10, w: x + w - tx0 - 6, h: 20 };
      choiceRects.push(r);
      if (sel) roundBox(r.x, r.y, r.w, r.h, 4, hexA(C.frost, 0.1), C.frost);
      text(`${i + 1}`, tx0, ty, 12, sel ? C.frost : C.muted, 'left', 'IBM Plex Mono');
      text(c.label, tx0 + 18, ty, 13, C.ink, 'left', 'IBM Plex Mono');
      ty += 22;
    });
  } else if (pageDone() && Math.sin(time * 6) > 0) {
    text('▼', x + w - 18, y + h - 14, 12, C.frost, 'center', 'IBM Plex Mono');
  }
}

/* ---------------------------------------------------------------------
   STEP 9: THE NOTEBOOK. Everything you've learned, in one place.
   Green = matches a clue about the killer. Red = rules them out.
   --------------------------------------------------------------------- */
function drawNotebook() {
  rect(0, 0, W, H, 'rgba(8, 5, 24, 0.7)');
  roundBox(36, 30, 568, 300, 8, '#efe6d2', '#8a6a4a');
  for (let y = 84; y < 320; y += 20) rect(50, y, 540, 1, 'rgba(90, 110, 160, 0.25)');
  rect(84, 30, 2, 300, 'rgba(200, 60, 60, 0.35)');
  const ink = '#2a1a16', green = '#2f7f3a', red = '#b8323f';
  text('CASE NOTES: THE DEATH OF LORD VANE', 100, 50, 12, ink, 'left');
  const k = kase.attrs[kase.killer];
  text('THE KILLER:', 100, 74, 10, ink, 'left');
  TRAITS.forEach((t, i) => text(`${TRAIT_LABEL[t]} ${clues[t] ? k[t] : '???'}`, 200 + i * 130, 74, 10, clues[t] ? red : '#8a7a6a', 'left'));
  const cols = [100, 250, 330, 450, 520];
  ['SUSPECT', 'HAND', 'SCENT', 'BOOTS', ''].forEach((h, i) => text(h, cols[i], 102, 9, '#6a5a4a', 'left'));
  SUSPECTS.forEach((s, r) => {
    const y = 130 + r * 34, a = kase.attrs[s];
    drawSprite(spr(s), 70, y + 14, 2);
    text(NAME[s], cols[0], y, 12, ink, 'left', 'IBM Plex Mono');
    if (talked.has(s)) TRAITS.forEach((t, i) => {
      const color = !clues[t] ? ink : a[t] === k[t] ? green : red;
      text(a[t], cols[i + 1], y, 12, color, 'left', 'IBM Plex Mono');
      if (clues[t] && a[t] !== k[t]) rect(cols[i + 1], y, ctx.measureText(a[t]).width, 1.5, red);
    });
    else text('not met yet', cols[1], y, 12, '#8a7a6a', 'left', 'IBM Plex Mono');
    const tags = [dead === s ? 'DEAD' : '', bet === s ? '★ YOUR BET' : ''].filter(Boolean).join('  ');
    text(tags, cols[4], y, 11, dead === s ? red : '#8a5a00', 'left', 'IBM Plex Mono');
  });
  text('N, Space or tap to close', W / 2, 316, 11, '#6a5a4a', 'center', 'IBM Plex Mono');
}

/* ---------------------------------------------------------------------
   STEP 10: THE REVEAL. Everyone lines up; the spotlight finds the truth.
   --------------------------------------------------------------------- */
const RANKS = {
  master: { title: 'MASTER DETECTIVE', sub: 'YOU WIN! You called it from the very start.', color: C.gold },
  lucky: { title: 'LUCKY DETECTIVE', sub: 'YOU WIN! Your gut was right, even if your head wasn\'t.', color: C.gold },
  noob: { title: 'NOOB DETECTIVE', sub: 'You win... as a NOOB. You cracked it, but your bet was wrong.', color: C.frost },
  total: { title: 'TOTAL NOOB', sub: 'You win... technically. As a total noob.', color: C.rose },
};

function startReveal() {
  const k = kase.killer, kt = kase.attrs[k];
  const others = alive().filter(s => s !== k && s !== accused);
  const blocker = others.length ? NAME[others[0]] : 'the snowdrift';
  const pages = [`You raise your staff and point it at ${NAME[accused]}. "It was you."`];
  if (accused !== k) pages.push(`${NAME[accused]} goes white. "Me? Look at my hands! Look at my boots!" The room erupts in shouting.`,
    `In the noise, ${NAME[k]} edges towards the door... and ${blocker} blocks the way. That flinch says everything.`);
  else pages.push(`Silence. Then ${NAME[k]} sinks into a chair.`);
  pages.push(`"${PEOPLE[k].confess}"`,
    `The ${kt.hand} hand. The smell of ${kt.scent}. The ${kt.boots} boots. It was ${NAME[k]} all along.`);
  const betRight = bet === k, accRight = accused === k;
  const rank = betRight ? (accRight ? 'master' : 'lucky') : (accRight ? 'noob' : 'total');
  stats.played++; if (betRight) stats.detective++; saveStats();
  fade = { t: 0, dir: 1, then: () => {
    state = 'reveal';
    reveal = { pages, page: 0, chars: 0, rank, betRight, accRight, confessAt: pages.length - 2 };
    layoutReveal();
  } };
}
function layoutReveal() {
  ctx.font = '13px "IBM Plex Mono", monospace';
  reveal.lines = wrap(reveal.pages[reveal.page] || '', W - 48);
  reveal.len = reveal.lines.join('').length;
}
function revealAction() {
  if (reveal.page >= reveal.pages.length) { newGame(); return; }        // results card -> title
  if (reveal.chars < reveal.len) { reveal.chars = Infinity; return; }
  reveal.page++; reveal.chars = 0; layoutReveal();
  if (reveal.page === reveal.confessAt) { shake = 6; chime(140, 0.5, 'sawtooth', 0.06); }
  if (reveal.page === reveal.pages.length) chime(reveal.betRight ? 880 : 330, 0.5);
}

function drawReveal() {
  const k = kase.killer, lit = reveal.page >= reveal.confessAt;
  GROUND = END_GROUND;
  drawLounge(300);
  const line = alive(), x0 = 110, step = line.length > 1 ? 330 / (line.length - 1) : 0;
  line.forEach((s, i) => {
    const x = x0 + i * step, isK = s === k && lit;
    const jit = isK && Math.sin(time * 30) > 0 ? 1 : 0;
    drawSprite(spr(s), x + jit, GROUND, 3);
    if (s === accused) text('▼', x, GROUND - 58 - Math.abs(Math.sin(time * 4)) * 4, 14, C.rose, 'center', 'IBM Plex Mono');
    if (s === bet) text('★', x, GROUND + 8, 11, C.gold, 'center', 'IBM Plex Mono');
  });
  drawWizard(560, GROUND, -1);
  if (lit) {                                     // the spotlight
    const kx = x0 + line.indexOf(k) * step;
    const g = ctx.createRadialGradient(kx, GROUND - 30, 30, kx, GROUND - 30, 200);
    g.addColorStop(0, 'rgba(5, 3, 15, 0)'); g.addColorStop(1, 'rgba(5, 3, 15, 0.85)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    poly([kx - 10, 0, kx + 10, 0, kx + 44, GROUND + 6, kx - 44, GROUND + 6], 'rgba(255, 240, 200, 0.12)');
  }
  GROUND = PLAY_GROUND;
  const top = 200;
  const g = ctx.createLinearGradient(0, top, 0, top + 16);
  g.addColorStop(0, 'rgba(15, 10, 38, 0)'); g.addColorStop(1, 'rgba(15, 10, 38, 0.96)');
  ctx.fillStyle = g; ctx.fillRect(0, top, W, H - top);

  if (reveal.page < reveal.pages.length) {
    text('THE REVEAL', 24, top + 26, 10, C.violet, 'left');
    ctx.font = '13px "IBM Plex Mono", monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.ink;
    let budget = reveal.chars, y = top + 52;
    for (const l of reveal.lines) { if (budget > 0) ctx.fillText(l.slice(0, Math.floor(budget)), 24, y); budget -= l.length; y += 19; }
    if (reveal.chars >= reveal.len && Math.sin(time * 6) > 0) text('▼', W - 24, H - 16, 12, C.frost, 'center', 'IBM Plex Mono');
    return;
  }
  const r = RANKS[reveal.rank];                  // the results card
  const mark = ok => ok ? '✔' : '✘';
  text(`KILLER: ${NAME[k].toUpperCase()}`, 24, top + 24, 10, C.violet, 'left');
  text(`YOUR BET: ${bet ? NAME[bet] : '-'}  ${mark(reveal.betRight)}`, 24, top + 44, 12, reveal.betRight ? '#8fd48a' : C.rose, 'left', 'IBM Plex Mono');
  text(`YOU ACCUSED: ${NAME[accused]}  ${mark(reveal.accRight)}`, 24, top + 62, 12, reveal.accRight ? '#8fd48a' : C.rose, 'left', 'IBM Plex Mono');
  text(r.title, 24, top + 96, 24, r.color, 'left');
  text(r.sub, 24, top + 122, 12, C.ink, 'left', 'IBM Plex Mono');
  text(`Detective wins: ${stats.detective} of ${stats.played} cases`, 24, H - 14, 11, C.muted, 'left', 'IBM Plex Mono');
  text('Space: new case, new killer', W - 24, H - 14, 11, C.ink, 'right', 'IBM Plex Mono');
}

/* ---------------------------------------------------------------------
   STEP 11: SCENES. title -> play -> reveal -> title (with a new case).
   --------------------------------------------------------------------- */
function newGame() {
  kase = newCase();
  talked = new Set(); bet = null; clues = {}; dead = null; murderTimer = 0; accused = null; hasKey = false;
  area = 'lounge'; player.x = 560; player.face = 1; reveal = null; dlg = null; notebook = false;
  state = 'title';
}
function startGame() {
  state = 'play';
  banner = null;
  say({ pages: [
    { text: 'A blizzard has buried the Snowbound Inn. Six guests are trapped inside, and one of them is you: a travelling wizard.' },
    { text: 'At midnight, a scream. Lord Aldric Vane has been found dead in his study. The door was locked. The key never left the innkeeper\'s belt.' },
    { text: 'Nobody can leave until the snow stops. One of the five people left in this inn is a murderer.' },
    { text: 'First, talk to all five suspects. Then you must place your BET on the killer. ← → walk · ↑/Space talk and search · N notebook.' }] });
}

/* ---------------------------------------------------------------------
   STEP 12: INPUT. Keyboard, and tap zones on touch screens.
   --------------------------------------------------------------------- */
const keys = {};
let touchDir = 0;
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  keys[e.key] = true;
  unlockAudio();
  if (e.key === 'm' || e.key === 'M') { muted = !muted; return; }
  if (fade) return;
  const act = [' ', 'Enter', 'ArrowUp', 'w', 'W'].includes(e.key);
  if (state === 'title') { if (act) startGame(); return; }
  if (state === 'reveal') { if (act) revealAction(); return; }
  if (notebook) { if (act || /^[nN]$|Escape|Tab/.test(e.key)) notebook = false; return; }
  if (e.key === 'n' || e.key === 'N' || e.key === 'Tab') { e.preventDefault(); notebook = true; chime(700, 0.08); return; }
  if (dlg) {
    if (choicesUp()) {
      const n = dlg.n.choices.length;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { dlg.sel = (dlg.sel + n - 1) % n; return; }
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { dlg.sel = (dlg.sel + 1) % n; return; }
      if (/^[1-9]$/.test(e.key) && +e.key <= n) { dlg.sel = +e.key - 1; return pick(dlg.sel); }
    }
    if (e.key === ' ' || e.key === 'Enter') advance();
    return;
  }
  if (act) interact();
});
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchDir = 0; });

function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => {
  canvas.focus(); unlockAudio();
  if (fade) return;
  const p = toWorld(e);
  if (state === 'title') return startGame();
  if (state === 'reveal') return revealAction();
  if (notebook) { notebook = false; return; }
  if (p.y < 24 && p.x > W - 130) { notebook = true; return; }       // tap the NOTEBOOK label
  if (dlg) {
    const hit = choicesUp() ? choiceRects.findIndex(r => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) : -1;
    if (hit >= 0) pick(hit); else advance();
    return;
  }
  if (p.x < W / 3) touchDir = -1;
  else if (p.x > W * 2 / 3) touchDir = 1;
  else interact();
});
addEventListener('pointerup', () => { touchDir = 0; });
addEventListener('pointercancel', () => { touchDir = 0; });

/* ---------------------------------------------------------------------
   STEP 13: SOUND.
   --------------------------------------------------------------------- */
let ac = null, muted = false;
function unlockAudio() { if (!ac) { try { ac = new AudioContext(); } catch {} } }
function chime(freq, dur = 0.18, type = 'triangle', vol = 0.05) {
  if (muted || !ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function scream() {
  if (muted || !ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(1100, t); o.frequency.exponentialRampToValueAtTime(260, t + 0.9);
  g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1.05);
}
const thud = () => chime(110, 0.2, 'sine', 0.08);

/* ---------------------------------------------------------------------
   UPDATE and DRAW, then the loop.
   --------------------------------------------------------------------- */
const WALK = 125;

function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 20);
  if (fade) {
    fade.t += dt * 4 * fade.dir;
    if (fade.dir === 1 && fade.t >= 1) { fade.t = 1; fade.then(); fade.dir = -1; }
    else if (fade.dir === -1 && fade.t <= 0) fade = null;
  }
  if (toastMsg && (toastMsg.t -= dt) <= 0) toastMsg = null;
  if (banner && (banner.t -= dt) <= 0) banner = null;
  if (state === 'reveal') { reveal.chars += dt * 50; return; }
  if (state !== 'play') return;

  if (dlg) dlg.chars += dt * 55;
  if (murderTimer > 0 && !dlg && !fade && (murderTimer -= dt) <= 0) secondMurder();
  let dir = 0;
  if (!dlg && !fade && !notebook) {
    if (keys.ArrowLeft || keys.a || keys.A) dir -= 1;
    if (keys.ArrowRight || keys.d || keys.D) dir += 1;
    if (!dir) dir = touchDir;
  }
  player.walking = dir !== 0;
  if (dir) {
    player.face = dir;
    player.x = clamp(player.x + dir * WALK * dt, 24, AREAS[area].w - 24);
    const before = Math.floor(player.walkT * 3.5);
    player.walkT += dt;
    if (Math.floor(player.walkT * 3.5) !== before) chime(AREAS[area].outdoor ? 90 : 120, 0.04, 'sine', 0.025);
  }
  cam = targetCam();
}

function drawPlay() {
  const A = AREAS[area];
  ctx.save();
  if (shake && !reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  A.draw(cam);
  world(cam, () => {
    for (const o of A.objs) {
      if (!o.npc) continue;
      if (dead === o.npc) { drawLying(spr(o.npc), o.x - 20, GROUND + 6, 3); continue; }
      const bob = Math.sin(time * 2 + o.x) > 0.6 ? 1 : 0;
      drawSprite(spr(o.npc), o.x, GROUND - bob, 3, player.x < o.x);
    }
    const bob = player.walking ? Math.abs(Math.sin(player.walkT * 10)) * 2 : 0;
    drawWizard(player.x, GROUND - bob, player.face);
  });
  if (A.outdoor) snowfall(60, 30, 0, W, 0, H, 0.7, cam);
  ctx.restore();

  const o = !dlg && !fade && !notebook && nearby();
  if (o) {
    const label = `↑  ${labelOf(o)}`;
    const by = GROUND - (o.npc && dead !== o.npc ? 64 : 110) - Math.abs(Math.sin(time * 3)) * 2;
    ctx.font = '11px "IBM Plex Mono", monospace';
    const w = ctx.measureText(label).width + 16, x = clamp(o.x - cam - w / 2, 6, W - w - 6);
    roundBox(x, by - 11, w, 22, 4, 'rgba(15, 10, 38, 0.88)', C.frost);
    text(label, x + w / 2, by, 11, C.ink, 'center', 'IBM Plex Mono');
  }

  rect(0, 0, W, 22, 'rgba(15, 10, 38, 0.8)');   // HUD
  text(A.name, 10, 11, 10, C.violet, 'left');
  const status = !bet ? `SUSPECTS MET ${talked.size}/5` : `BET: ${SHORT[bet]}  ·  CLUES ${clueCount()}/3`;
  text(status, W / 2, 11, 10, bet ? C.gold : C.frost);
  text('N  NOTEBOOK', W - 10, 11, 10, C.muted, 'right');
  if (banner && !dlg) { ctx.globalAlpha = Math.min(1, banner.t); text(banner.text, W / 2, 62, 18, C.ink); ctx.globalAlpha = 1; }
  if (toastMsg) {
    ctx.globalAlpha = Math.min(1, toastMsg.t * 2);
    ctx.font = '12px "Silkscreen", monospace';
    const w = ctx.measureText(toastMsg.msg).width + 24;
    roundBox(W / 2 - w / 2, 32, w, 22, 4, 'rgba(15, 10, 38, 0.92)', C.gold);
    text(toastMsg.msg, W / 2, 43, 12, C.gold);
    ctx.globalAlpha = 1;
  }
  if (dlg) drawDialog();
  if (notebook) drawNotebook();
}

function drawTitle() {
  drawCourtyard(0);
  snowfall(70, 30);
  rect(0, 0, W, H, 'rgba(15, 10, 38, 0.72)');
  drawSprite(spr('vane'), 250, 138, 3, false, 0.5);
  drawWizard(320, 138, 1, 3);
  drawSprite(spr('rosalind'), 390, 138, 3, true, 0.5);
  text('FROZENWIZARD PRESENTS', W / 2, 158, 11, C.violet);
  text('MURDER AT THE', W / 2, 182, 16, C.muted);
  text('SNOWBOUND INN', W / 2, 210, 32, C.frost);
  text('A different killer every game. Bet early. Trust nobody.', W / 2, 246, 13, C.muted, 'center', 'IBM Plex Mono');
  if (stats.played) text(`Detective wins: ${stats.detective} of ${stats.played} cases`, W / 2, 268, 12, C.muted, 'center', 'IBM Plex Mono');
  if (Math.sin(time * 4) > -0.3) text('Press Space or tap to begin', W / 2, 304, 14, C.ink, 'center', 'IBM Plex Mono');
}

function draw() {
  ctx.imageSmoothingEnabled = false;
  if (state === 'title') drawTitle();
  else if (state === 'reveal') drawReveal();
  else drawPlay();
  if (fade) rect(0, 0, W, H, `rgba(8, 5, 24, ${clamp(fade.t, 0, 1)})`);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
document.fonts.ready.then(() => requestAnimationFrame(frame));
canvas.focus();
</script>
</body>
</html>
