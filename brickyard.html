<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brickyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* FrozenWizard theme: shared by every FW game. One dark look, colors set explicitly. */
  :root {
    color-scheme: dark;
    --bg: #1a1240;         /* indigo */
    --court: #231a52;
    --line: #3a2d78;
    --ink: #eaf6ff;        /* ice white */
    --muted: #a59cd0;
    --violet: #b48cff;
    --purple: #7c4ddb;
    --blueviolet: #7a6cf0;
    --frost: #8fd3ff;
    --rose: #ff6fa8;       /* danger / game over */
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 "IBM Plex Mono", ui-monospace, Consolas, monospace;
    padding: 12px 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header {
    width: 100%;
    max-width: var(--game-w);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  h1 {
    font: 700 22px/1 "Silkscreen", "IBM Plex Mono", monospace;
    letter-spacing: 0.04em;
    margin: 0;
    color: var(--frost);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 40px; height: 40px; image-rendering: pixelated; }
  .studio {
    display: block;
    font: 700 11px/1 "Silkscreen", "IBM Plex Mono", monospace;
    letter-spacing: 0.08em;
    color: var(--frost);
    margin-bottom: 4px;
  }
  .studio span { color: var(--violet); }
  .keys { color: var(--muted); font-size: 12px; text-align: right; }
  kbd {
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 4px;
    color: var(--ink);
  }
  :root { --game-w: min(520px, calc((100dvh - 110px) * 0.8), 100%); }
  canvas {
    display: block;
    width: var(--game-w);
    aspect-ratio: 4 / 5;
    max-width: 100%;
    background: var(--court);
    border: 2px solid var(--line);
    border-radius: 6px;
    touch-action: none;
    cursor: none;
  }
  canvas:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  @media (max-width: 440px) { .keys { display: none; } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="logo" src="brand/frozenwizard-logo.svg" alt="FrozenWizard logo">
    <div><span class="studio">FROZEN<span>WIZARD</span></span><h1>Brickyard</h1></div>
  </div>
  <div class="keys"><kbd>←</kbd> <kbd>→</kbd> or mouse · <kbd>Space</kbd> launch / pause · <kbd>M</kbd> sound</div>
</header>
<canvas id="game" tabindex="0" aria-label="Breakout game. Use arrow keys or the mouse to move the paddle, Space to launch the ball."></canvas>

<script>
/* =====================================================================
   BRICKYARD: a Breakout clone, organised by learning step.
   Everything runs in a fixed 480x600 "world"; the canvas is scaled to fit.
   ===================================================================== */
const W = 480, H = 600;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLORS = { court: css('--court'), line: css('--line'), ink: css('--ink'), muted: css('--muted'),
                 violet: css('--violet'), purple: css('--purple'), blueviolet: css('--blueviolet'),
                 frost: css('--frost'), rose: css('--rose') };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

/* ---------------------------------------------------------------------
   STEP 1: PADDLE. Input -> velocity -> position, scaled by delta time.
   --------------------------------------------------------------------- */
const paddle = { x: W / 2, y: H - 40, w: 80, h: 12, speed: 460 };
const keys = {};
let mouseX = null;          // when the mouse moves, the paddle follows it

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', ' ', 'Space'].includes(e.key)) e.preventDefault();
  keys[e.key] = true; mouseX = null;
  if (e.key === ' ') onAction();
  if (e.key === 'm' || e.key === 'M') sound.muted = !sound.muted;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') togglePause();
});
addEventListener('keyup', e => { keys[e.key] = false; });

function pointerToWorld(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
canvas.addEventListener('pointermove', e => { mouseX = pointerToWorld(e); });
canvas.addEventListener('pointerdown', e => { mouseX = pointerToWorld(e); canvas.focus(); onAction(); });

function updatePaddle(dt) {
  if (mouseX !== null) {
    paddle.x += (mouseX - paddle.x) * Math.min(1, dt * 25);  // smooth follow
  } else {
    let dir = 0;
    if (keys.ArrowLeft || keys.a || keys.A) dir -= 1;
    if (keys.ArrowRight || keys.d || keys.D) dir += 1;
    paddle.x += dir * paddle.speed * dt;                       // frame-rate independent
  }
  const half = paddle.w / 2;
  paddle.x = Math.max(half, Math.min(W - half, paddle.x));    // clamp to the court
}

/* ---------------------------------------------------------------------
   STEP 2: BALL. Constant velocity, bounces off walls, lost off the bottom.
   --------------------------------------------------------------------- */
const ball = { x: 0, y: 0, r: 6, vx: 0, vy: 0, speed: 300, stuck: true };
const BASE_SPEED = 300, MAX_SPEED = 560;

function resetBall() {
  ball.stuck = true;
  ball.speed = BASE_SPEED + (level - 1) * 30;
  ball.vx = ball.vy = 0;
}
function launchBall() {
  ball.stuck = false;
  const angle = (Math.random() * 40 - 20) * Math.PI / 180;
  ball.vx = ball.speed * Math.sin(angle);
  ball.vy = -ball.speed * Math.cos(angle);
  sound.play(520, 0.05);
}

function updateBall(dt) {
  if (ball.stuck) {                     // riding on the paddle before launch
    ball.x = paddle.x; ball.y = paddle.y - paddle.h / 2 - ball.r - 1;
    return;
  }
  // Move in small substeps so a fast ball can't tunnel through a brick.
  const steps = Math.ceil(ball.speed * dt / (ball.r * 0.8));
  const sdt = dt / steps;
  for (let i = 0; i < steps; i++) {
    ball.x += ball.vx * sdt;
    ball.y += ball.vy * sdt;

    if (ball.x < ball.r)      { ball.x = ball.r;      ball.vx =  Math.abs(ball.vx); wallHit(); }
    if (ball.x > W - ball.r)  { ball.x = W - ball.r;  ball.vx = -Math.abs(ball.vx); wallHit(); }
    if (ball.y < ball.r + HUD){ ball.y = ball.r + HUD; ball.vy =  Math.abs(ball.vy); wallHit(); }
    if (ball.y > H + ball.r * 2) { loseLife(); return; }

    hitPaddle();
    if (hitBricks()) continue;
  }
}
function wallHit() { sound.play(220, 0.03); }

/* ---------------------------------------------------------------------
   STEP 3: PADDLE BOUNCE. Where the ball lands decides the new angle.
   Hitting the centre sends it straight up; the edges send it out at 60°.
   --------------------------------------------------------------------- */
const MAX_BOUNCE = 60 * Math.PI / 180;

function hitPaddle() {
  if (ball.vy <= 0) return;             // only when falling
  const left = paddle.x - paddle.w / 2, top = paddle.y - paddle.h / 2;
  if (ball.x + ball.r < left || ball.x - ball.r > left + paddle.w) return;
  if (ball.y + ball.r < top  || ball.y - ball.r > top + paddle.h) return;

  const offset = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w / 2)));
  const angle = offset * MAX_BOUNCE;
  ball.vx = ball.speed * Math.sin(angle);
  ball.vy = -ball.speed * Math.cos(angle);
  ball.y = top - ball.r;
  combo = 0;
  squash = 1;
  sound.play(330, 0.05);
}

/* ---------------------------------------------------------------------
   STEP 4: BRICKS. Built from level data in code, not placed by hand.
   Digits are hit points; "." is an empty cell.
   --------------------------------------------------------------------- */
const LEVELS = [
  [ '1111111111',
    '1111111111',
    '1111111111',
    '1111111111',
    '1111111111' ],
  [ '..111111..',
    '.12222221.',
    '1223333221',
    '.12222221.',
    '..111111..' ],
  [ '3.3.3.3.3.',
    '.2.2.2.2.2',
    '1111111111',
    '2..2..2..2',
    '1111111111',
    '.1.1.1.1.1' ],
];
const COLS = 10, BRICK_H = 18, GAP = 4, TOP = 70;
const BRICK_W = (W - GAP * (COLS + 1)) / COLS;
const ROW_COLORS = () => [COLORS.violet, COLORS.purple, COLORS.blueviolet, COLORS.frost];
let bricks = [];

function buildLevel(n) {
  const map = LEVELS[(n - 1) % LEVELS.length];
  const palette = ROW_COLORS();
  bricks = [];
  map.forEach((row, r) => {
    [...row].forEach((ch, c) => {
      if (ch === '.') return;
      bricks.push({
        x: GAP + c * (BRICK_W + GAP),
        y: TOP + r * (BRICK_H + GAP),
        w: BRICK_W, h: BRICK_H,
        hp: +ch, maxHp: +ch,
        color: palette[r % palette.length],
      });
    });
  });
}

// Circle-vs-rectangle test. On a hit, reflect on the axis with the smaller overlap.
function hitBricks() {
  for (const b of bricks) {
    const cx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
    const cy = Math.max(b.y, Math.min(ball.y, b.y + b.h));
    const dx = ball.x - cx, dy = ball.y - cy;
    if (dx * dx + dy * dy > ball.r * ball.r) continue;

    const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
    const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
    if (overlapX < overlapY) {
      ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
    } else {
      ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy);
    }
    damageBrick(b);
    return true;                        // one brick per substep keeps bounces sane
  }
  return false;
}

/* ---------------------------------------------------------------------
   STEP 5: GAME STATE. Score, lives, win and lose checks.
   The brick "tells" the game it broke by calling onBrickDestroyed,
   which is the same idea as a signal/event in an engine.
   --------------------------------------------------------------------- */
const HUD = 36;
let score = 0, lives = 3, level = 1, combo = 0;
let best = 0;
try { best = +localStorage.getItem('brickyard-best') || 0; } catch {}

function damageBrick(b) {
  b.hp--;
  b.flash = 1;
  if (b.hp <= 0) onBrickDestroyed(b);
  else sound.play(440, 0.04);
}
function onBrickDestroyed(b) {
  bricks.splice(bricks.indexOf(b), 1);
  combo++;
  score += 10 * b.maxHp * combo;       // chain bricks without touching the paddle for bonus
  ball.speed = Math.min(MAX_SPEED, ball.speed + 4);
  const s = ball.speed / Math.hypot(ball.vx, ball.vy);
  ball.vx *= s; ball.vy *= s;
  burst(b.x + b.w / 2, b.y + b.h / 2, b.color);
  shake = Math.min(6, shake + 2);
  sound.play(600 + combo * 40, 0.06);
  if (bricks.length === 0) setState('clear');
}
function loseLife() {
  lives--;
  combo = 0;
  shake = 8;
  sound.play(120, 0.25, 'sawtooth');
  if (lives <= 0) { saveBest(); setState('over'); }
  else resetBall();
}
function saveBest() {
  if (score > best) {
    best = score;
    try { localStorage.setItem('brickyard-best', String(best)); } catch {}
  }
}

/* ---------------------------------------------------------------------
   STEP 6: MENUS / SCENES. One small state machine drives every screen.
   title -> play <-> paused -> clear -> play (next level) ... -> over -> title
   --------------------------------------------------------------------- */
let state = 'title';

function setState(s) { state = s; }

function newGame() {
  score = 0; lives = 3; level = 1;
  buildLevel(level); resetBall(); setState('play');
}
function onAction() {                   // Space / click does the obvious thing on each screen
  sound.unlock();
  if (state === 'title' || state === 'over') newGame();
  else if (state === 'clear') { level++; buildLevel(level); resetBall(); setState('play'); }
  else if (state === 'paused') setState('play');
  else if (state === 'play' && ball.stuck) launchBall();
  else if (state === 'play') setState('paused');
}
function togglePause() {
  if (state === 'play') setState('paused');
  else if (state === 'paused') setState('play');
}
addEventListener('blur', () => { if (state === 'play') setState('paused'); });

/* ---------------------------------------------------------------------
   STEP 7: POLISH. Particles, screen shake, paddle squash, sound.
   --------------------------------------------------------------------- */
let particles = [], shake = 0, squash = 0;

function burst(x, y, color) {
  const n = reduceMotion ? 4 : 14;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.6, color });
  }
}
function updateFx(dt) {
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt * 30);
  squash = Math.max(0, squash - dt * 6);
  for (const b of bricks) if (b.flash) b.flash = Math.max(0, b.flash - dt * 6);
}

const sound = {
  ac: null, muted: false,
  unlock() {                            // browsers only allow audio after a click or key
    if (!this.ac) { try { this.ac = new AudioContext(); } catch {} }
  },
  play(freq, dur, type = 'square') {
    if (this.muted || !this.ac) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ac.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
};

/* ---------------------------------------------------------------------
   DRAWING. Kept separate from updating, as in any engine.
   --------------------------------------------------------------------- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}
function text(str, x, y, size, color, align = 'center', font = 'Silkscreen') {
  ctx.fillStyle = color;
  ctx.font = `${size}px "${font}", "IBM Plex Mono", monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}

function draw() {
  ctx.save();
  ctx.fillStyle = COLORS.court; ctx.fillRect(0, 0, W, H);
  if (shake && !reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // court lines
  ctx.strokeStyle = COLORS.line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, HUD); ctx.lineTo(W, HUD); ctx.stroke();
  ctx.setLineDash([4, 8]);
  ctx.beginPath(); ctx.moveTo(0, paddle.y + 20); ctx.lineTo(W, paddle.y + 20); ctx.stroke();
  ctx.setLineDash([]);

  // HUD
  text(`SCORE ${String(score).padStart(5, '0')}`, 12, HUD / 2, 14, COLORS.ink, 'left');
  text(`LV ${level}`, W / 2, HUD / 2, 14, COLORS.muted);
  text('●'.repeat(Math.max(0, lives)), W - 12, HUD / 2, 14, COLORS.violet, 'right', 'IBM Plex Mono');

  // bricks: tougher bricks show their remaining hits as notches
  for (const b of bricks) {
    ctx.globalAlpha = 0.45 + 0.55 * (b.hp / b.maxHp);
    ctx.fillStyle = b.flash ? COLORS.ink : b.color;
    roundRect(b.x, b.y, b.w, b.h, 3);
    ctx.globalAlpha = 1;
    if (b.maxHp > 1) {
      ctx.fillStyle = COLORS.court;
      for (let i = 0; i < b.hp; i++) ctx.fillRect(b.x + 6 + i * 6, b.y + b.h / 2 - 2, 3, 4);
    }
  }

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // paddle (squashes briefly on a hit)
  const pw = paddle.w * (1 + squash * 0.12), ph = paddle.h * (1 - squash * 0.3);
  ctx.fillStyle = COLORS.frost;
  roundRect(paddle.x - pw / 2, paddle.y - ph / 2, pw, ph, ph / 2);

  // ball
  if (state !== 'title') {
    ctx.fillStyle = COLORS.ink;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  drawOverlay();
}

// Studio logo for the title screen (shared file in brand/)
const logo = new Image();
logo.src = 'brand/frozenwizard-logo.svg';

function panel(title, lines, titleColor = COLORS.frost) {
  ctx.fillStyle = 'rgba(8, 26, 30, 0.82)';
  ctx.fillRect(0, HUD + 1, W, H - HUD - 1);
  text(title, W / 2, H / 2 - 50, 34, titleColor);
  lines.forEach((l, i) => text(l, W / 2, H / 2 + i * 26, 13, i === lines.length - 1 ? COLORS.ink : COLORS.muted, 'center', 'IBM Plex Mono'));
}

function drawOverlay() {
  if (state === 'title') {
    panel('BRICKYARD', [`Best ${best}`, 'Chain bricks between paddle hits for a combo bonus', '', 'Press Space or click to start']);
    if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, W / 2 - 48, H / 2 - 190, 96, 96);
    text('FROZENWIZARD PRESENTS', W / 2, H / 2 - 84, 11, COLORS.violet);
  }
  else if (state === 'paused') panel('PAUSED', ['', 'Press Space or click to resume']);
  else if (state === 'clear') panel(`LEVEL ${level} CLEAR`, [`Score ${score}`, '', 'Press Space or click for the next level'], COLORS.violet);
  else if (state === 'over') panel('GAME OVER', [`Score ${score}  ·  Best ${best}`, '', 'Press Space or click to play again'], COLORS.rose);
  else if (state === 'play' && ball.stuck) text('SPACE / CLICK TO LAUNCH', W / 2, H - 80, 12, COLORS.muted);
}

/* ---------------------------------------------------------------------
   THE GAME LOOP. Measure delta time, update, draw, repeat.
   --------------------------------------------------------------------- */
let last = performance.now();
buildLevel(1); resetBall();

function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);  // cap dt so a lag spike can't teleport the ball
  last = now;
  if (state === 'play') { updatePaddle(dt); updateBall(dt); }
  else if (state === 'title') updatePaddle(dt);
  updateFx(dt);
  draw();
  requestAnimationFrame(frame);
}
document.fonts.ready.then(() => requestAnimationFrame(frame));
canvas.focus();
</script>
</body>
</html>
