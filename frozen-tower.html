<head>

<title>The Frozen Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* FrozenWizard theme: shared by every FW game. One dark look, colors set explicitly. */
  :root {
    color-scheme: dark;
    --bg: #1a1240;         /* indigo */
    --court: #231a52;
    --line: #3a2d78;
    --ink: #eaf6ff;        /* ice white */
    --muted: #a59cd0;
    --violet: #b48cff;
    --purple: #7c4ddb;
    --blueviolet: #7a6cf0;
    --frost: #8fd3ff;
    --rose: #ff6fa8;       /* danger / sad endings */
    --gold: #ffd66e;       /* warm endings */
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 "IBM Plex Mono", ui-monospace, Consolas, monospace;
    padding: 12px 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  header {
    width: 100%;
    max-width: var(--game-w);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  h1 {
    font: 700 22px/1 "Silkscreen", "IBM Plex Mono", monospace;
    letter-spacing: 0.04em;
    margin: 0;
    color: var(--frost);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 40px; height: 40px; image-rendering: pixelated; }
  .studio {
    display: block;
    font: 700 11px/1 "Silkscreen", "IBM Plex Mono", monospace;
    letter-spacing: 0.08em;
    color: var(--frost);
    margin-bottom: 4px;
  }
  .studio span { color: var(--violet); }
  .keys { color: var(--muted); font-size: 12px; text-align: right; }
  kbd {
    font: inherit;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 4px;
    color: var(--ink);
  }
  :root { --game-w: min(880px, calc((100dvh - 132px) * 16 / 9), 100%); }
  canvas {
    display: block;
    width: var(--game-w);
    aspect-ratio: 16 / 9;
    max-width: 100%;
    background: var(--court);
    border: 2px solid var(--line);
    border-radius: 6px;
    touch-action: none;
  }
  canvas:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }
  @media (max-width: 600px) { .keys { display: none; } }
  .copy { color: var(--muted); font-size: 11px; margin: 0; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="logo" src="brand/frozenwizard-logo.svg" alt="FrozenWizard logo">
    <div><span class="studio">FROZEN<span>WIZARD</span></span><h1>The Frozen Tower</h1></div>
  </div>
  <div class="keys"><kbd>←</kbd><kbd>→</kbd> walk · <kbd>↑</kbd>/<kbd>Space</kbd> act · <kbd>1</kbd>–<kbd>4</kbd> choose</div>
</header>
<canvas id="game" tabindex="0" aria-label="The Frozen Tower, a small story adventure. Left and Right to walk, Up or Space to talk, look and go through doors, number keys to pick answers."></canvas>
<p class="copy">© 2026 FrozenWizard · Trusha Patel. All rights reserved.</p>

<script>
/* =====================================================================
   THE FROZEN TOWER: a small walk-around story adventure.
   Walk between places, talk to people, pick things up. What you carry
   (and who walks with you) decides which of six endings you reach.
   Everything runs in a fixed 640x360 world; the canvas is scaled to fit.
   ===================================================================== */
const W = 640, H = 360;
const PLAY_GROUND = 304, END_GROUND = 196;
let GROUND = PLAY_GROUND;               // the snow line feet stand on (endings use a higher one)
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const C = { night: '#120c30', court: '#231a52', line: '#3a2d78', ink: '#eaf6ff', muted: '#a59cd0',
            violet: '#b48cff', purple: '#7c4ddb', frost: '#8fd3ff', ice: '#bfe3ff', rose: '#ff6fa8', gold: '#ffd66e' };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;    // keep the pixel art crisp
}
resize();
addEventListener('resize', resize);

/* ---------------------------------------------------------------------
   STEP 1: PIXEL CHARACTERS. Each sprite is a little grid of letters;
   each letter is a palette colour and "." is see-through.
   --------------------------------------------------------------------- */
const PAL = { k: '#0f0a26', s: '#f2c9a0', b: '#6b4226', r: '#e0445a', o: '#d9803a', g: '#c9c5da',
              p: '#7c4ddb', w: '#eaf6ff', f: '#8fd3ff', q: '#d6ecff', x: '#4a8fd0', c: '#8a5a3c' };
const SPR = {
  mira: [
    '....bbbbb...',
    '...bbbbbbb..',
    '...bsssssb..',
    '...bsksksb..',
    '...bsssssb..',
    '....rrrrr...',
    '...rrrrrrrr.',
    '...ooooooo..',
    '..sooooooos.',
    '...ooooooo..',
    '...ooooooo..',
    '...ooooooo..',
    '....kk.kk...',
    '....kk.kk...'],
  grandma: [
    '.....ggg....',
    '...ggggggg..',
    '...gsssssg..',
    '...gsksksg..',
    '....sssss...',
    '...ppppppp..',
    '..ppppppppp.',
    '..sxxxxxxxs.',
    '...xxxxxxx..',
    '...xxxxxxx..',
    '..xxxxxxxxx.',
    '..xxxxxxxxx.',
    '..xxxxxxxxx.',
    '...kk...kk..'],
  baker: [
    '...wwwwwww..',
    '...wwwwwww..',
    '....wwwww...',
    '...bsssssb..',
    '...bsksksb..',
    '...bsssssb..',
    '....sbbbs...',
    '..ccwwwwwcc.',
    '.sccwwwwwccs',
    '..ccwwwwwcc.',
    '..ccwwwwwcc.',
    '..ccwwwwwcc.',
    '..ccccccccc.',
    '...kk...kk..',
    '...kk...kk..'],
  queen: [
    '..f...f...f...',
    '..fffffffff...',
    '...wwwwwww....',
    '..wwqqqqqww...',
    '..wwqkqkqww...',
    '..wwqqqqqww...',
    '..wwwqqqwww...',
    '..ww.fff.ww...',
    '...fffffff....',
    '..fffffffff...',
    '.qfffffffffq..',
    '..fffffffff...',
    '..ffxfffxff...',
    '..fffffffff...',
    '.fffffffffff..',
    '.fffxfffxfff..',
    'fffffffffffff.',
    'fffffffffffff.',
    'xfffffffffffx.',
    'xxfffffffffxx.'],
  fox: [
    '..........w.w.',
    '.........wwww.',
    'ww.......wkwwk',
    'www..wwwwwwww.',
    '.wwwwwwwwwww..',
    '..wwwwwwwwww..',
    '...w.w...w.w..',
    '...w.w...w.w..'],
};
const sprCache = {};
function spr(name) {
  if (sprCache[name]) return sprCache[name];
  const rows = SPR[name], c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (PAL[ch]) { g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1); } }));
  return (sprCache[name] = c);
}
// Draw a sprite standing with its feet at (x, y).
function drawSprite(src, x, y, scale, flip = false, alpha = 1) {
  if (!src) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(Math.round(x), Math.round(y));
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(src, -src.width * scale / 2, -src.height * scale, src.width * scale, src.height * scale);
  ctx.restore();
}

// The studio logo is the wizard. We also bake an ice-blue copy for one ending.
const wizardImg = new Image();
let wizardC = null, wizardIce = null;
wizardImg.onload = () => {
  wizardC = document.createElement('canvas'); wizardC.width = wizardC.height = 24;
  wizardC.getContext('2d').drawImage(wizardImg, 0, 0, 24, 24);
  wizardIce = document.createElement('canvas'); wizardIce.width = wizardIce.height = 24;
  const g = wizardIce.getContext('2d');
  g.drawImage(wizardC, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = 'rgba(143, 211, 255, 0.6)'; g.fillRect(0, 0, 24, 24);
};
wizardImg.src = 'brand/frozenwizard-logo.svg';

function drawWizard(x, y, face, img = wizardC, scale = 2) {
  drawSprite(img, x + 2.5 * scale * face, y, scale, face < 0);   // sprite's body sits left of centre
}

/* ---------------------------------------------------------------------
   STEP 2: DRAWING HELPERS. Small shapes the scenery is built from.
   --------------------------------------------------------------------- */
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function poly(pts, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function ellipse(x, y, rx, ry, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, hexA(color, a)); g.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function sky(top, bottom) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);
}
function text(str, x, y, size, color, align = 'center', font = 'Silkscreen') {
  ctx.fillStyle = color;
  ctx.font = `${size}px "${font}", "IBM Plex Mono", monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function roundBox(x, y, w, h, r, fill, stroke) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
// Draw world-space things (positions along the whole area) shifted by the camera.
function world(camX, fn) { ctx.save(); ctx.translate(-Math.round(camX), 0); fn(); ctx.restore(); }

const STARS = Array.from({ length: 70 }, (_, i) => ({ x: hash(i) * W, y: hash(i + 200) * 190, tw: 1 + hash(i + 400) * 3 }));
function stars(camX, f = 0.05) {
  for (const s of STARS) {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time * s.tw + s.x);
    rect((((s.x - camX * f) % W) + W) % W, s.y, 1.5, 1.5, C.ink);
  }
  ctx.globalAlpha = 1;
}
function moon(x, y, r) { glow(x, y, r * 4, C.ink, 0.12); ellipse(x, y, r, r, '#e8eefc'); ellipse(x + r * 0.35, y - r * 0.2, r * 0.25, r * 0.25, '#cfd8f0'); }

// Snow falls over outdoor scenes. Positions come from a hash, so no particle list is needed.
function snowfall(n, speed, camX = 0, x0 = 0, x1 = W, alpha = 0.7) {
  if (reduceMotion) n = Math.floor(n / 4);
  ctx.fillStyle = C.ink;
  const span = x1 - x0;
  for (let i = 0; i < n; i++) {
    const sp = speed * (0.5 + hash(i + 7));
    const y = (hash(i + 99) * H + time * sp) % H;
    const x = x0 + (((hash(i) * span + Math.sin(time + i) * 8 - camX * 0.6) % span) + span) % span;
    const r = 1 + hash(i + 3) * 1.5;
    ctx.globalAlpha = alpha; ctx.fillRect(x, y, r, r);
  }
  ctx.globalAlpha = 1;
}

// Jagged mountains with snowy tips, scrolling slower than the ground (parallax).
function range(camX, f, baseY, amp, step, color, seed, caps) {
  const off = camX * f, i0 = Math.floor(off / step) - 1, n = Math.ceil(W / step) + 3;
  const pt = i => [i * step - off, baseY - hash(i + seed) * amp];
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let i = i0; i <= i0 + n; i++) ctx.lineTo(...pt(i));
  ctx.lineTo(W, H); ctx.fill();
  if (!caps) return;
  for (let i = i0 + 1; i < i0 + n; i++) {
    const [x, y] = pt(i), [lx, ly] = pt(i - 1), [rx, ry] = pt(i + 1);
    if (y > ly || y > ry) continue;                                   // only real peaks get snow
    ctx.globalAlpha = 0.75;
    poly([x, y, x + (rx - x) * 0.25, y + (ry - y) * 0.25, x, y + 8, x + (lx - x) * 0.25, y + (ly - y) * 0.25], C.ink);
    ctx.globalAlpha = 1;
  }
}

function pine(x, baseY, h, color, snow = 0.8) {
  rect(x - h * 0.04, baseY - h * 0.2, h * 0.08, h * 0.2, '#2a1c1c');
  for (let k = 0; k < 3; k++) {
    const w = h * 0.62 * (1 - k * 0.24), yb = baseY - h * 0.16 - k * h * 0.24, th = h * 0.42;
    poly([x - w / 2, yb, x + w / 2, yb, x, yb - th], color);
    if (snow) { ctx.globalAlpha = snow; poly([x - w * 0.18, yb - th * 0.64, x + w * 0.18, yb - th * 0.64, x, yb - th], C.ink); ctx.globalAlpha = 1; }
  }
}
function pineRow(camX, f, baseY, h, step, color, seed, snow = 0.35) {
  const off = camX * f, i0 = Math.floor(off / step) - 2;
  for (let i = i0; i < i0 + W / step + 4; i++) {
    pine(i * step + hash(i + seed) * step * 0.6 - off, baseY, h * (0.7 + hash(i * 7 + seed) * 0.6), color, snow);
  }
}
function ground(camX, color) {
  rect(0, GROUND, W, H - GROUND, color);
  rect(0, GROUND, W, 2, hexA(C.ink, 0.7));
  const step = 90, i0 = Math.floor(camX / step) - 1;
  for (let i = i0; i < i0 + W / step + 3; i++) ellipse(i * step + hash(i) * 40 - camX, GROUND + 8 + hash(i + 5) * 20, 26 + hash(i + 9) * 20, 4, hexA(C.ink, 0.25));
}

/* ---------------------------------------------------------------------
   STEP 3: SCENERY. Buildings, trees and props, each a small function.
   --------------------------------------------------------------------- */
function house(x, w, h, wall, roof, o = {}) {
  const top = GROUND - h, peak = top - h * 0.5;
  rect(x + w * 0.68, peak + h * 0.14, 14, h * 0.4, '#4a3f7a');                 // chimney
  rect(x + w * 0.68 - 2, peak + h * 0.14 - 4, 18, 5, C.ink);
  rect(x, top, w, h, wall);
  ctx.fillStyle = 'rgba(15, 10, 38, 0.28)';                                      // timber beams
  ctx.fillRect(x, top, w, 5); ctx.fillRect(x + 6, top, 5, h); ctx.fillRect(x + w - 11, top, 5, h);
  poly([x - 16, top + 1, x + w + 16, top + 1, x + w / 2, peak - 7], C.ink);      // snow on the roof
  poly([x - 12, top + 7, x + w + 12, top + 7, x + w / 2, peak + 2], roof);
  for (let ix = x - 8; ix < x + w + 8; ix += 12) poly([ix, top + 7, ix + 4, top + 7, ix + 2, top + 11 + hash(ix) * 8], C.ice);
  const wins = w >= 130 ? [x + 22, x + w - 42] : [x + 16];
  const flick = 0.5 + 0.12 * Math.sin(time * 3 + x);                              // candles that give no heat
  for (const wx of wins) {
    const wy = top + 22;
    glow(wx + 10, wy + 10, 32, C.gold, 0.16);
    rect(wx - 2, wy - 2, 24, 24, '#2a1c1c');
    rect(wx, wy, 20, 20, hexA(C.gold, flick));
    rect(wx + 9, wy, 2, 20, '#2a1c1c'); rect(wx, wy + 9, 20, 2, '#2a1c1c');
    rect(wx - 3, wy + 21, 26, 3, C.ink);
  }
  const dx = x + w / 2 - 13;
  rect(dx, GROUND - 40, 26, 40, '#3b2620');
  rect(dx + 19, GROUND - 21, 3, 3, C.gold);
  if (o.sign) {                                                                  // bakery sign with a bun
    rect(x + w + 2, top + 14, 24, 3, '#2a1c1c');
    rect(x + w + 8, top + 18, 18, 16, '#8a5a3c');
    ellipse(x + w + 17, top + 27, 6, 4, '#d9803a');
  }
}
function towerOutside(cx) {
  rect(cx - 70, GROUND - 260, 140, 260, '#4a3f7a');
  ctx.fillStyle = 'rgba(15, 10, 38, 0.25)';
  for (let r = 0; r < 13; r++) for (let c = 0; c < 4; c++) ctx.fillRect(cx - 70 + c * 36 + (r % 2 ? 18 : 0), GROUND - 260 + r * 20, 34, 2);
  poly([cx - 88, GROUND - 256, cx + 88, GROUND - 256, cx, GROUND - 350], C.ink);
  poly([cx - 82, GROUND - 250, cx + 82, GROUND - 250, cx, GROUND - 340], '#5a33a8');
  for (const wy of [GROUND - 210, GROUND - 140]) { rect(cx - 10, wy, 20, 28, '#1a1240'); rect(cx - 8, wy + 2, 16, 24, hexA(C.frost, 0.25)); }
  rect(cx - 20, GROUND - 62, 40, 62, '#2e2468');
  rect(cx - 16, GROUND - 58, 32, 58, '#6b4a36');
  ellipse(cx, GROUND - 58, 16, 10, '#6b4a36');
  rect(cx + 8, GROUND - 30, 3, 3, C.gold);
}
function lamp(x) {
  rect(x - 2, GROUND - 70, 4, 70, '#1a1240');
  rect(x - 7, GROUND - 84, 14, 14, '#2a2060');
  rect(x - 5, GROUND - 82, 10, 10, hexA(C.frost, 0.45));
  glow(x, GROUND - 77, 28, C.frost, 0.16);
  rect(x - 8, GROUND - 87, 16, 3, C.ink);
}
function well(x) {
  rect(x - 26, GROUND - 26, 52, 26, '#6d6590');
  rect(x - 26, GROUND - 26, 52, 4, C.ink);
  rect(x - 24, GROUND - 70, 4, 44, '#5a3a2a'); rect(x + 20, GROUND - 70, 4, 44, '#5a3a2a');
  poly([x - 34, GROUND - 64, x + 34, GROUND - 64, x, GROUND - 90], '#6b4a36');
  poly([x - 30, GROUND - 72, x + 30, GROUND - 72, x, GROUND - 92], C.ink);
  rect(x - 1, GROUND - 64, 2, 16, '#2a1c1c'); rect(x - 6, GROUND - 48, 12, 9, '#8a5a3c');
}
function fence(x0, x1) {
  rect(x0, GROUND - 22, x1 - x0, 3, '#6b4a36'); rect(x0, GROUND - 12, x1 - x0, 3, '#6b4a36');
  for (let x = x0; x <= x1; x += 22) { rect(x, GROUND - 28, 5, 28, '#6b4a36'); rect(x - 1, GROUND - 31, 7, 3, C.ink); }
}
function woodGate(x) {
  rect(x - 38, GROUND - 96, 8, 96, '#5a3a2a'); rect(x + 30, GROUND - 96, 8, 96, '#5a3a2a');
  rect(x - 46, GROUND - 102, 92, 10, '#6b4a36'); rect(x - 48, GROUND - 106, 96, 5, C.ink);
  rect(x - 32, GROUND - 86, 64, 15, '#8a5a3c');
  text('WHITEWOOD', x, GROUND - 78, 8, C.ink);
}
function signpost(x, label) {
  rect(x - 3, GROUND - 64, 6, 64, '#5a3a2a');
  rect(x - 44, GROUND - 62, 88, 16, '#8a5a3c'); rect(x - 45, GROUND - 65, 90, 3, C.ink);
  text(label, x, GROUND - 54, 8, C.ink);
}
function iceArch(x, s = 1) {
  const top = GROUND - 150 * s;
  rect(x - 14 * s, top, 28 * s, 150 * s, hexA(C.frost, 0.16 + 0.08 * Math.sin(time * 2)));
  glow(x, GROUND - 70 * s, 90 * s, C.frost, 0.2);
  rect(x - 30 * s, top, 16 * s, 150 * s, C.ice); rect(x + 14 * s, top, 16 * s, 150 * s, C.ice);
  rect(x - 28 * s, top, 4 * s, 150 * s, C.ink); rect(x + 16 * s, top, 4 * s, 150 * s, C.ink);
  ctx.strokeStyle = C.ice; ctx.lineWidth = 14 * s;
  ctx.beginPath(); ctx.arc(x, top, 22 * s, Math.PI, 0); ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const a = time * 0.7 + i * 1.05;
    rect(x + Math.cos(a) * 30 * s, GROUND - 80 * s + Math.sin(a * 1.3) * 60 * s, 2, 2, C.ink);
  }
}
function bellShape(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  poly([-10, 0, 10, 0, 20, 30, -20, 30], '#4a8fd0');
  ellipse(0, 1, 10, 7, '#4a8fd0');
  poly([-5, 2, -1, 2, -6, 28, -12, 28], C.frost);
  rect(-22, 28, 44, 5, C.frost);
  ellipse(0, 36, 4, 4, '#2a2060');
  ctx.restore();
}
function oak(x, base, s = 1, bell = true) {
  glow(x, base - 200 * s, 150 * s, C.frost, 0.14);
  ctx.strokeStyle = C.ice; ctx.lineCap = 'round';
  const branches = [[-90, -225, 10], [85, -235, 10], [-45, -270, 7], [40, -280, 7], [0, -300, 6], [-120, -195, 6], [120, -200, 6]];
  for (const [bx, by, lw] of branches) {
    ctx.lineWidth = lw * s; ctx.beginPath();
    ctx.moveTo(x, base - 140 * s);
    ctx.quadraticCurveTo(x + bx * 0.3 * s, base + by * 0.75 * s, x + bx * s, base + by * s);
    ctx.stroke();
  }
  rect(x - 12 * s, base - 150 * s, 24 * s, 150 * s, C.ice);
  rect(x - 6 * s, base - 150 * s, 5 * s, 150 * s, C.ink);
  poly([x - 26 * s, base, x + 26 * s, base, x + 12 * s, base - 20 * s, x - 12 * s, base - 20 * s], C.ice);
  if (bell) {
    const hx = x + 55 * s, hy = base - 222 * s;
    glow(hx, hy + 45 * s, 60 * s, C.frost, 0.25);
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(Math.sin(time * 1.6) * 0.12);
    rect(-1, 0, 2, 24 * s, '#c9c5da');

}
function aurora() {
  ctx.lineWidth = 18; ctx.lineCap = 'round';
  for (let b = 0; b < 3; b++) {
    ctx.strokeStyle = hexA(b % 2 ? C.violet : C.frost, 0.1);
    ctx.beginPath();
    for (let x = 0; x <= W; x += 16) {
      const y = 46 + b * 20 + Math.sin(x * 0.012 + time * 0.5 + b * 1.7) * 16;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
}
function wolfEyes(x, y, i) {
  if (Math.sin(time * 0.9 + i * 2.1) < -0.5) return;     // they blink
  glow(x + 5, y + 1, 12, C.gold, 0.25);
  rect(x, y, 3, 2, C.gold); rect(x + 8, y, 3, 2, C.gold);
}

/* ---------------------------------------------------------------------
   STEP 7: DIALOG BOX. Text types itself out; Space finishes a page,
   then moves on. On the last page the choices appear.
   --------------------------------------------------------------------- */
const DLG_FONT = '13px "IBM Plex Mono", monospace';
let choiceRects = [];

function wrap(str, maxW) {
  const out = [];
  for (const para of str.split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t;
    }
    out.push(line);
  }
  return out;
}
function openDialog(id) {
  const n = DIALOG[id];
  dlg = { id, n, page: 0, chars: 0, sel: 0, gave: false };
  layoutPage();
}
function layoutPage() {
  ctx.font = DLG_FONT;
  dlg.lines = wrap(dlg.n.pages[dlg.page], W - 20 - 32 - (dlg.n.speaker ? 72 : 0));
  dlg.len = dlg.lines.join('').length;
}
const pageDone = () => dlg.chars >= dlg.len;
const lastPage = () => dlg.page === dlg.n.pages.length - 1;
const choicesUp = () => dlg && lastPage() && pageDone() && dlg.n.choices;

function advance() {
  if (!pageDone()) { dlg.chars = Infinity; return; }
  if (!lastPage()) { dlg.page++; dlg.chars = 0; layoutPage(); return; }
  if (dlg.n.choices) { pick(dlg.sel); return; }
  if (dlg.n.give) give(dlg.n.give);
  dlg = null;
}
function pick(i) {
  const c = dlg.n.choices[i];
  if (!c) return;
  if (c.needs && !flags.has(c.needs)) { chime(160, 0.15); return; }
  chime(520);
  dlg = null;
  if (c.give) give(c.give);
  if (c.to) openDialog(c.to);
  else if (c.go) travel(...c.go);
  else if (c.end) startEnding(c.end);
}
function moveSel(d) {
  const n = dlg.n.choices.length;
  dlg.sel = (dlg.sel + d + n) % n;
}

function drawDialog() {
  const n = dlg.n, sp = n.speaker && SPEAKERS[n.speaker];
  const choices = choicesUp() ? n.choices : [];
  const tx0 = 26 + (sp ? 72 : 0);
  const h = Math.max(sp ? 88 : 0, 16 + (sp ? 18 : 0) + dlg.lines.length * 18 + (choices.length ? 8 + choices.length * 22 : 18));
  const x = 10, w = W - 20, y = H - 10 - h;

   STEP 9: SCENES. title -> play -> ending -> title ...

function startGame() {
  flags = new Set(); followers = [];
  area = 'tower'; player.x = 250; player.face = 1;
  state = 'play';
  openDialog('wake');
}
function endingAction() {
  if (ending.chars < ending.len) { ending.chars = Infinity; return; }

/* ---------------------------------------------------------------------
   STEP 10: INPUT. Keyboard, plus tap zones on touch screens:
   left third walks left, right third walks right, middle acts.
   --------------------------------------------------------------------- */
const keys = {};
let touchDir = 0;
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  keys[e.key] = true;
  unlockAudio();
  if (e.key === 'm' || e.key === 'M') { muted = !muted; return; }
  if (fade) return;
  const act = [' ', 'Enter', 'ArrowUp', 'w', 'W'].includes(e.key);
  if (state === 'title') { if (act) startGame(); return; }
  if (state === 'ending') { if (act) endingAction(); return; }
  if (dlg) {
    if (choicesUp()) {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') return moveSel(-1);
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') return moveSel(1);
      if (/^[1-9]$/.test(e.key)) { dlg.sel = +e.key - 1; return pick(dlg.sel); }
    }
    if (e.key === ' ' || e.key === 'Enter') advance();
    return;
  }
  if (act) interact();
});
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchDir = 0; });

function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
canvas.addEventListener('pointerdown', e => {
  canvas.focus(); unlockAudio();
  if (fade) return;
  const p = toWorld(e);
  if (state === 'title') return startGame();
  if (state === 'ending') return endingAction();
  if (dlg) {
    const hit = choicesUp() ? choiceRects.findIndex(r => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) : -1;
    if (hit >= 0) { dlg.sel = hit; pick(hit); } else advance();
    return;
  }
  if (p.x < W / 3) touchDir = -1;
  else if (p.x > W * 2 / 3) touchDir = 1;
  else interact();
});
addEventListener('pointerup', () => { touchDir = 0; });
addEventListener('pointercancel', () => { touchDir = 0; });

/* ---------------------------------------------------------------------
   STEP 11: SOUND. Tiny synth blips, only after the first key or tap.
   --------------------------------------------------------------------- */
let ac = null, muted = false;
function unlockAudio() { if (!ac) { try { ac = new AudioContext(); } catch {} } }
function chime(freq, dur = 0.18, type = 'triangle', vol = 0.05) {
  if (muted || !ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
const thud = () => chime(110, 0.2, 'sine', 0.08);

/* ---------------------------------------------------------------------
   UPDATE and DRAW, then the loop.
   --------------------------------------------------------------------- */
const WALK = 120;

function update(dt) {
  time += dt;
  if (fade) {
    fade.t += dt * 4 * (fade.speed ? 1 / fade.speed : 1) * fade.dir;
    if (fade.dir === 1 && fade.t >= 1) { fade.t = 1; fade.then(); fade.dir = -1; }
    else if (fade.dir === -1 && fade.t <= 0) fade = null;
  }
  if (toastMsg && (toastMsg.t -= dt) <= 0) toastMsg = null;
  if (banner && (banner.t -= dt) <= 0) banner = null;
  if (state === 'ending') { ending.chars += dt * 45; return; }
  if (state !== 'play') return;

  if (dlg) { dlg.chars += dt * 55; if (lastPage() && pageDone() && dlg.n.give && !dlg.gave) { dlg.gave = true; give(dlg.n.give); } }
  let dir = 0;
  if (!dlg && !fade) {
    if (keys.ArrowLeft || keys.a || keys.A) dir -= 1;
    if (keys.ArrowRight || keys.d || keys.D) dir += 1;
    if (!dir) dir = touchDir;
  }
  player.walking = dir !== 0;
  if (dir) {
    player.face = dir;
    player.x = clamp(player.x + dir * WALK * dt, 24, AREAS[area].w - 24);
    const before = Math.floor(player.walkT * 3.5);
    player.walkT += dt;
    if (Math.floor(player.walkT * 3.5) !== before) chime(AREAS[area].outdoor ? 90 : 70, 0.05, 'sine', 0.03);  // footsteps
  }
  followers.forEach((f, i) => {
    const tx = player.x - player.face * (34 + i * 30), d = tx - f.x;
    f.walking = Math.abs(d) > 3;
    if (f.walking) { f.x += d * Math.min(1, dt * 3); f.face = Math.sign(d); }
    else f.face = player.x >= f.x ? 1 : -1;
    f.x = clamp(f.x, 16, AREAS[area].w - 16);
  });
  cam = targetCam();
}

function drawPlay() {
  const A = AREAS[area];
  A.draw(cam);
  world(cam, () => {
    for (const o of A.objs) {                    // people, facing you
      if (!o.npc || (o.hide && o.hide())) continue;
      const bob = Math.sin(time * 2 + o.x) > 0.6 ? 1 : 0;
      drawSprite(spr(o.npc), o.x, GROUND - bob, 3, o.npc === 'fox' ? player.x < o.x : false);
    }
    for (const f of followers) {
      const hop = f.walking ? Math.abs(Math.sin(time * 10)) * 2 : 0;
      drawSprite(spr(f.who), f.x, GROUND - hop, 3, f.who === 'fox' ? f.face < 0 : false);
    }
    const bob = player.walking ? Math.abs(Math.sin(player.walkT * 10)) * 2 : 0;
    drawWizard(player.x, GROUND - bob, player.face);
  });
  if (A.over) A.over(cam);
  if (A.outdoor) snowfall(60, 30, cam);

  const o = !dlg && !fade && nearby();           // "↑ Talk to Mira" hint
  if (o) {
    const bx = o.x - cam, by = GROUND - (o.npc === 'queen' ? 84 : o.npc ? 64 : 96);
    const label = `↑  ${o.label}`;
    ctx.font = '11px "IBM Plex Mono", monospace';
    const w = ctx.measureText(label).width + 16, x = clamp(bx - w / 2, 6, W - w - 6);
    roundBox(x, by - 11 - Math.abs(Math.sin(time * 3)) * 2, w, 22, 4, 'rgba(15, 10, 38, 0.88)', C.frost);
    text(label, x + w / 2, by - Math.abs(Math.sin(time * 3)) * 2, 11, C.ink, 'center', 'IBM Plex Mono');
  }

  rect(0, 0, W, 22, 'rgba(15, 10, 38, 0.72)');   // HUD
  text(A.name, 10, 11, 10, C.violet, 'left');
  text([...flags].map(f => ITEM[f]).join('  ·  '), W / 2, 11, 10, C.frost);
  text(`ENDINGS ${found.size}/${ENDING_IDS.length}`, W - 10, 11, 10, C.muted, 'right');
  if (banner && !dlg) {
    ctx.globalAlpha = Math.min(1, banner.t);
    text(banner.text, W / 2, 64, 18, C.ink);
    ctx.globalAlpha = 1;
  }
  if (toastMsg) {
    ctx.globalAlpha = Math.min(1, toastMsg.t * 2);
    ctx.font = '12px "Silkscreen", monospace';
    const w = ctx.measureText(toastMsg.msg).width + 24;
    roundBox(W / 2 - w / 2, 32, w, 22, 4, 'rgba(15, 10, 38, 0.9)', C.gold);
    text(toastMsg.msg, W / 2, 43, 12, C.gold);
    ctx.globalAlpha = 1;
  }
  if (dlg) drawDialog();
}

function drawTitle() {
  drawTowerRoom();
  rect(0, 0, W, H, 'rgba(15, 10, 38, 0.82)');
  drawWizard(320, 128, 1, wizardC, 3);
  text('FROZENWIZARD PRESENTS', W / 2, 150, 11, C.violet);
  text('THE FROZEN TOWER', W / 2, 184, 32, C.frost);
  text('A short winter tale. Walk, talk, choose.', W / 2, 220, 13, C.muted, 'center', 'IBM Plex Mono');
  text(`Endings found: ${found.size} of ${ENDING_IDS.length}`, W / 2, 244, 13, C.muted, 'center', 'IBM Plex Mono');
  if (Math.sin(time * 4) > -0.3) text('Press Space or tap to begin', W / 2, 290, 14, C.ink, 'center', 'IBM Plex Mono');
  snowfall(40, 25, 0, 0, W, 0.4);
}

function draw() {
  ctx.imageSmoothingEnabled = false;
  if (state === 'title') drawTitle();
  else if (state === 'ending') drawEnding();
  else drawPlay();
  if (fade) rect(0, 0, W, H, `rgba(8, 5, 24, ${clamp(fade.t, 0, 1)})`);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
document.fonts.ready.then(() => requestAnimationFrame(frame));
canvas.focus();
</script>
</body>
</html>
